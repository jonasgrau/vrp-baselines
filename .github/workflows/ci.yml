name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[hgs,dev]"
      - run: pytest -q
      - run: vrp-baselines bench instances/A-n32-k5.vrp instances/CMT6.vrp -t 2 --seeds 1-2
